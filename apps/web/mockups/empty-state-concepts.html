<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:40px; font-family:'Inter',sans-serif; background:#F3F5F4; color:#0B1F1C; display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  :root { --line:rgba(11,31,28,.09); --ink-faint:rgba(11,31,28,.42); --primary:#0E6B5C; }
  .col { width: 360px; }
  .col-label { font-size:11px; color:var(--ink-faint); margin-bottom:10px; font-weight:500; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card-head { padding:12px 18px; border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-faint); display:flex; }
  .card-head span { flex:1; }

  /* A: icono suelto, sin circulo */
  .a-empty { display:flex; flex-direction:column; align-items:center; text-align:center; padding: 44px 24px; }
  .a-empty i { font-size:22px; color:var(--ink-faint); margin-bottom:12px; }
  .a-empty p.t { font-size:13.5px; font-weight:500; margin:0; }
  .a-empty p.d { font-size:13px; color:var(--ink-faint); margin:3px 0 16px; }
  .a-empty button { border:1px solid rgba(11,31,28,.16); background:none; padding:7px 14px; border-radius:7px; font-size:12.5px; cursor:pointer; }

  /* B: sin icono, tipografico, regla fina */
  .b-empty { padding: 30px 24px 34px; text-align:center; }
  .b-rule { width:32px; height:1px; background:var(--line); margin: 0 auto 18px; }
  .b-empty p.t { font-size:13.5px; font-weight:500; margin:0; }
  .b-empty p.d { font-size:13px; color:var(--ink-faint); margin:3px 0 16px; }
  .b-empty a { font-family:'IBM Plex Mono'; font-size:12px; color:var(--primary); text-decoration:none; border-bottom:1px solid var(--primary); padding-bottom:1px; }
</style>
</head>
<body>

<div class="col">
  <div class="col-label">A · Ícono suelto, sin círculo</div>
  <div class="card">
    <div class="card-head"><span>Fecha</span><span>Método</span><span>Estado</span></div>
    <div class="a-empty">
      <i class="ti ti-shopping-cart"></i>
      <p class="t">Sin compras todavía</p>
      <p class="d">Las compras que registres van a aparecer acá.</p>
      <button>Registrar la primera</button>
    </div>
  </div>
</div>

<div class="col">
  <div class="col-label">B · Sin ícono, tipográfico</div>
  <div class="card">
    <div class="card-head"><span>Fecha</span><span>Método</span><span>Estado</span></div>
    <div class="b-empty">
      <div class="b-rule"></div>
      <p class="t">Sin compras todavía</p>
      <p class="d">Las compras que registres van a aparecer acá.</p>
      <a href="#">Registrar la primera →</a>
    </div>
  </div>
</div>

</body>
</html>
