name: CI

on:
  push:
    branches: [feat/finance-api-complete]
  pull_request:
    branches: [feat/finance-api-complete]

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      # prisma generate solo necesita el schema, no una conexión real -> un
      # placeholder alcanza. Nunca se ponen credenciales reales de Supabase
      # en CI para correr la suite de tests unitarios (mockean Prisma).
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci_placeholder"
      JWT_ACCESS_SECRET: "ci-placeholder-access-secret"
      JWT_REFRESH_SECRET: "ci-placeholder-refresh-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --coverage=false
